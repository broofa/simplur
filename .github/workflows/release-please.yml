# Relevant docs:
# - https://github.com/googleapis/release-please
# - https://github.com/googleapis/release-please-action

name: release-please

on:
  workflow_dispatch:
    inputs:
      release_created:
        description: Publish even when Release Please did not create a release
        type: boolean
        required: false
        default: false

  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # Steps below handle publication to NPM
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created || inputs.release_created }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created || inputs.release_created }}

      - name: Verify release
        if: ${{ steps.release.outputs.release_created || inputs.release_created }}
        run: |
          npm ci
          npm run docs
          npm test
      - run: npm publish --provenance --access public

        if: ${{ steps.release.outputs.release_created || inputs.release_created }}
